<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f7f5ef"><link rel="manifest" href="manifest.json"><title>Sudoku Pencil v0.3</title>
<style>
:root{--p:#f7f5ef;--i:#242424;--h:#37352f;--panel:#efede6}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--p);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial}
button{font:inherit;border:0;background:transparent;color:inherit}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);max-width:1500px;margin:auto}
.top{height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}.title{font-family:"Bradley Hand","Marker Felt",cursive;font-size:32px}
.center{display:flex;gap:15px;align-items:center;color:#625f57}.status{font-size:13px;color:#77736a}.actions{display:flex;gap:6px}.action{padding:10px 12px;border-radius:12px}.action:active,.panel button:hover{background:#e4e1d8}
.content{min-height:0;display:grid;grid-template-columns:210px minmax(300px,760px) 210px;gap:24px;align-items:center;justify-content:center}
.panel{background:#efede6bf;border:1px solid #dedbd1;border-radius:16px;padding:18px;color:#555148}.panel h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 12px;color:#77736a}
.panel button{display:block;width:100%;text-align:left;padding:10px 8px;border-radius:10px}.selected{background:#e0ddd4!important}.stats{border-top:1px solid #d8d5cc;margin-top:15px;padding-top:15px;font-size:13px;line-height:1.8}
.boardwrap{width:min(78vw,78vh,760px);aspect-ratio:1}canvas{width:100%;height:100%;display:block;background:#fffdf9;border:2px solid var(--h);touch-action:none;box-shadow:0 4px 18px #0000000d}
.bottom{text-align:center;padding:8px 0 12px;color:#817d73;font-size:13px}@media(max-width:900px){.content{grid-template-columns:1fr}.panel{display:none}.boardwrap{width:min(92vw,76vh)}.top{height:58px}.center{font-size:13px}.title{font-size:27px}.status{display:none}}
</style></head><body>
<div class="app"><header class="top"><div class="title">Sudoku</div><div class="center"><span>Medium</span><span id="timer">00:00</span><span>✦ Pencil</span><span id="status">Recognition ready</span></div><div class="actions"><button class="action" id="undo">Undo</button><button class="action" id="redo">Redo</button><button class="action" id="clear">Clear</button></div></header>
<main class="content"><aside class="panel"><h3>Puzzle</h3><button id="new">＋ New puzzle</button><button class="selected">Medium</button><button>Hard</button><div class="stats">Recognized cells&nbsp;&nbsp;<span id="count">0</span><br>Best time&nbsp;&nbsp;—</div></aside>
<div class="boardwrap"><canvas id="board"></canvas></div>
<aside class="panel"><h3>Writing</h3><button id="erase">Eraser</button><button id="pencil" class="selected">Pencil</button><button id="recognize">Recognize cell</button><div class="stats" id="message">Write a digit, tap its cell, then tap Recognize cell.<br><br>Your original Pencil ink stays on the page.</div></aside></main>
<div class="bottom">v0.3 · experimental handwritten-digit recognition</div></div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
<script>
const puzzle=[[0,0,0,2,6,0,7,0,1],[6,8,0,0,7,0,0,9,0],[1,9,0,0,0,4,5,0,0],[8,2,0,1,0,0,0,4,0],[0,0,4,6,0,2,9,0,0],[0,5,0,0,0,3,0,2,8],[0,0,9,3,0,0,0,7,4],[0,4,0,0,5,0,0,3,6],[7,0,3,0,1,8,0,0,0]];
const MODEL='https://raw.githubusercontent.com/aralroca/MNIST_React_TensorFlowJS/master/public/assets/model.json';
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');let size=0,cells=Array.from({length:81},()=>[]),undo=[],redo=[],stroke=null,active=-1,selected=-1,erase=false,recognized={},model=null,modelPromise=null;
function snap(){return{cells:cells.map(a=>a.map(s=>s.map(p=>({...p})))),recognized:{...recognized}}}
function restore(s){cells=s.cells.map(a=>a.map(st=>st.map(p=>({...p}))));recognized={...s.recognized};document.getElementById('count').textContent=Object.keys(recognized).length}
function save(){undo.push(snap());if(undo.length>50)undo.shift();redo=[]}
function resize(){let r=canvas.parentElement.getBoundingClientRect();size=Math.floor(Math.min(r.width,r.height));let d=devicePixelRatio||1;canvas.width=size*d;canvas.height=size*d;ctx.setTransform(d,0,0,d,0,0);draw()}new ResizeObserver(resize).observe(canvas.parentElement);
function draw(){let c=size/9;ctx.clearRect(0,0,size,size);ctx.fillStyle='#fffdf9';ctx.fillRect(0,0,size,size);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`600 ${Math.round(c*.31)}px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial`;for(let r=0;r<9;r++)for(let x=0;x<9;x++)if(puzzle[r][x]){ctx.fillStyle='#77736a';ctx.fillText(puzzle[r][x],x*c+c/2,r*c+c/2)}ctx.strokeStyle='#222';ctx.lineCap='round';ctx.lineJoin='round';for(let i=0;i<81;i++){let r=Math.floor(i/9),x=i%9;for(const s of cells[i]){if(s.length<2)continue;ctx.lineWidth=s.w||Math.max(2,c*.026);ctx.beginPath();ctx.moveTo(x*c+s[0].x,r*c+s[0].y);for(let k=1;k<s.length;k++)ctx.lineTo(x*c+s[k].x,r*c+s[k].y);ctx.stroke()}}if(selected>=0){ctx.strokeStyle='#77736a';ctx.lineWidth=2;ctx.strokeRect(selected%9*c+3,Math.floor(selected/9)*c+3,c-6,c-6)}for(let i=1;i<9;i++){ctx.strokeStyle=i%3?'#b5b1a8':'#37352f';ctx.lineWidth=i%3?1:2;ctx.beginPath();ctx.moveTo(i*c,0);ctx.lineTo(i*c,size);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*c);ctx.lineTo(size,i*c);ctx.stroke()}ctx.strokeStyle='#37352f';ctx.lineWidth=2;ctx.strokeRect(1,1,size-2,size-2)}
function point(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function cellAt(p){let c=Math.floor(p.x/(size/9)),r=Math.floor(p.y/(size/9));return r>=0&&r<9&&c>=0&&c<9?r*9+c:-1}
canvas.addEventListener('pointerdown',e=>{let p=point(e),i=cellAt(p);if(i<0||puzzle[Math.floor(i/9)][i%9])return;selected=i;save();if(erase){cells[i]=[];delete recognized[i];draw();return}let c=size/9,x=i%9,r=Math.floor(i/9);stroke=[{x:p.x-x*c,y:p.y-r*c}];stroke.w=Math.max(2,c*.026);cells[i].push(stroke);active=i;canvas.setPointerCapture(e.pointerId);draw()});
canvas.addEventListener('pointermove',e=>{if(!stroke)return;let p=point(e),c=size/9,x=active%9,r=Math.floor(active/9);stroke.push({x:p.x-x*c,y:p.y-r*c});draw()});function end(){stroke=null;active=-1}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
async function getModel(){if(model)return model;if(modelPromise)return modelPromise;document.getElementById('status').textContent='Loading recognition…';modelPromise=tf.loadLayersModel(MODEL).then(m=>{model=m;document.getElementById('status').textContent='Recognition ready';return m}).catch(e=>{document.getElementById('status').textContent='Recognition unavailable';throw e});return modelPromise}
function renderDigit(strokes){let cv=document.createElement('canvas'),g=cv.getContext('2d');cv.width=cv.height=140;g.fillStyle='black';g.fillRect(0,0,140,140);g.strokeStyle='white';g.lineCap='round';g.lineJoin='round';let all=[];for(const s of strokes){if(s.length<2)continue;for(const p of s)all.push(p)}if(!all.length)return null;let minX=Math.min(...all.map(p=>p.x)),maxX=Math.max(...all.map(p=>p.x)),minY=Math.min(...all.map(p=>p.y)),maxY=Math.max(...all.map(p=>p.y)),w=Math.max(1,maxX-minX),h=Math.max(1,maxY-minY),scale=105/Math.max(w,h),ox=(140-w*scale)/2-minX*scale,oy=(140-h*scale)/2-minY*scale;g.lineWidth=Math.max(5,8*scale);for(const s of strokes){if(s.length<2)continue;g.beginPath();g.moveTo(s[0].x*scale+ox,s[0].y*scale+oy);for(let k=1;k<s.length;k++)g.lineTo(s[k].x*scale+ox,s[k].y*scale+oy);g.stroke()}return cv}
async function recognize(){if(selected<0){document.getElementById('message').textContent='Select a cell first.';return}if(!cells[selected].length){document.getElementById('message').textContent='That cell is empty.';return}try{const m=await getModel(),cv=renderDigit(cells[selected]);let t=tf.browser.fromPixels(cv,1).toFloat().div(255).resizeBilinear([28,28]).expandDims(0),out=m.predict(t),v=await out.data(),best=0;for(let i=1;i<v.length;i++)if(v[i]>v[best])best=i;t.dispose();out.dispose();if(best===0||v[best]<.55){document.getElementById('message').textContent='I am not confident. Try writing the digit larger and more clearly.';return}save();recognized[selected]=best;document.getElementById('count').textContent=Object.keys(recognized).length;document.getElementById('message').textContent=`Looks like ${best} · ${Math.round(v[best]*100)}%`;draw()}catch(e){document.getElementById('message').textContent='Recognition could not load. Check your internet connection and try again.'}}
document.getElementById('recognize').onclick=recognize;document.getElementById('erase').onclick=()=>{erase=!erase;document.getElementById('erase').classList.toggle('selected',erase);document.getElementById('pencil').classList.toggle('selected',!erase)};document.getElementById('pencil').onclick=()=>{erase=false;document.getElementById('erase').classList.remove('selected');document.getElementById('pencil').classList.add('selected')};document.getElementById('clear').onclick=()=>{save();cells=Array.from({length:81},()=>[]);recognized={};selected=-1;document.getElementById('count').textContent='0';draw()};document.getElementById('undo').onclick=()=>{if(undo.length){redo.push(snap());restore(undo.pop());draw()}};document.getElementById('redo').onclick=()=>{if(redo.length){undo.push(snap());restore(redo.pop());draw()}};document.getElementById('new').onclick=()=>{save();cells=Array.from({length:81},()=>[]);recognized={};selected=-1;draw()};
let sec=0;setInterval(()=>{sec++;document.getElementById('timer').textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`},1000);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});resize();
</script></body></html>
