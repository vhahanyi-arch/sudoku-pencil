<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f3ead6">
  <link rel="manifest" href="manifest.json">
  <title>Sudoku Pencil</title>
  <style>
    :root{--paper:#f3ead6;--paper2:#fffaf0;--ink:#242019;--muted:#706756;--line:#8f826b;--heavy:#302a21;--accent:#426b61;--peer:#e8dfc9;--selected:#d4e8dc;--error:#b8443e}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:ui-rounded,"Avenir Next",system-ui,sans-serif}body{display:flex;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 12px max(18px,env(safe-area-inset-bottom));background-image:radial-gradient(#a8987818 .7px,transparent .8px);background-size:8px 8px}
    main{width:min(96vw,720px)}header{display:flex;align-items:end;justify-content:space-between;margin:4px 0 12px}.brand{font:700 clamp(25px,5vw,38px) Georgia,serif}.version{font-size:12px;color:var(--muted)}
    .difficulty{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}.difficulty button,.toolbar button,select{border:1px solid #a99a7e;background:#fff9ed;color:var(--ink);border-radius:10px;padding:10px 7px;font-weight:650}.difficulty button.active{background:var(--accent);color:white;border-color:var(--accent)}
    .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:8px 2px}.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(9,1fr);background:var(--paper2);border:4px solid var(--heavy);box-shadow:0 6px 20px #594d3620;touch-action:none;user-select:none}
    .cell{position:relative;min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent}.cell.peer{background:var(--peer)}.cell.match{background:#eadfb2}.cell.match canvas{filter:contrast(1.8)}.cell.match .given{font-weight:900;transform:scale(1.13)}.cell.selected{background:var(--selected)}.cell.selected.match{background:#c8dfc9}.cell.error{box-shadow:inset 0 0 0 3px var(--error);z-index:2}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+73){border-bottom:0}.cell:nth-child(3n):not(:nth-child(9n)){border-right:3px solid var(--heavy)}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:3px solid var(--heavy)}
    canvas{width:100%;height:100%;display:block}.given{position:absolute;inset:0;display:grid;place-items:center;font:800 clamp(23px,6.4vw,42px) Georgia,serif;color:#17140f;pointer-events:none}.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:11px}.toolbar button.on{background:#355f55;color:#fff}.toolbar button.danger{color:var(--error)}
    .profilebar{display:flex;align-items:center;gap:8px;margin:0 0 10px}.profilebar label{font-size:13px;color:var(--muted)}.profilebar select{flex:1}.profilebar button{padding:9px 12px;border:1px solid #a99a7e;border-radius:10px;background:#fff9ed}.settings{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;margin-top:9px;color:var(--muted);font-size:13px}.status{min-height:24px;text-align:center;margin:9px 0 2px;font-weight:650;color:var(--accent)}
    .boardwrap{position:relative}.pauseCover{position:absolute;inset:0;z-index:8;display:none;place-items:center;text-align:center;background:#f3ead6f5;border:4px solid var(--heavy);font:700 26px Georgia,serif}.pauseCover.show{display:grid}.pauseCover small{display:block;font:500 14px system-ui;margin-top:8px;color:var(--muted)}input{width:100%;padding:10px;border:1px solid #a99a7e;border-radius:9px;background:white;font:inherit}
    dialog{border:0;border-radius:17px;background:#fffaf0;color:var(--ink);width:min(92vw,430px);box-shadow:0 20px 70px #0005;padding:20px}dialog::backdrop{background:#27201688}.digits{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.digits button{font:700 22px Georgia;padding:12px;border-radius:9px;border:1px solid #a99a7e;background:white}.dialog-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.dialog-actions button{padding:9px 13px;border-radius:9px;border:1px solid #a99a7e;background:white}.stats{line-height:1.7}
    @media(max-width:500px){body{padding-left:7px;padding-right:7px}.toolbar{grid-template-columns:repeat(2,1fr)}.given{font-size:clamp(21px,7.4vw,34px)}}
  </style>
</head>
<body><main>
  <header><div class="brand">Sudoku Pencil</div><div class="version">v0.9</div></header>
  <div class="profilebar"><label for="profileSelect">Playing as</label><select id="profileSelect"></select><button id="manageProfiles">Profiles</button></div>
  <div class="difficulty" id="difficulty"></div>
  <div class="meta"><span id="levelLabel">Medium</span><span id="timer">00:00</span></div>
  <div class="boardwrap"><div class="board" id="board" aria-label="Sudoku board"></div><div class="pauseCover" id="pauseCover"><div>Game paused<small>The puzzle is hidden while the timer is stopped.</small></div></div></div>
  <div class="status" id="status">Write a number with your finger or Pencil</div>
  <div class="toolbar">
    <button id="notes">Notes: Off</button><button id="pause">Pause</button><button id="erase">Erase cell</button><button id="correct">Correct digit</button><button id="newGame">New puzzle</button>
  </div>
  <div class="settings"><label for="check">Mistake checking</label><select id="check"><option value="solution">Check against solution</option><option value="conflict">Sudoku conflicts only</option><option value="off">Off</option></select><label for="matching">Highlight matching digits</label><select id="matching"><option value="on">On</option><option value="off">Off</option></select></div>
  <div class="toolbar"><button id="resume">Reload saved game</button><button id="stats">Stats</button></div>
</main>
<dialog id="correctDialog"><h3>What number did you write?</h3><div class="digits" id="digits"></div><div class="dialog-actions"><button data-close>Cancel</button></div></dialog>
<dialog id="finishDialog"><h2>Puzzle complete</h2><p id="finishText"></p><div class="dialog-actions"><button data-close>Close</button><button id="finishNew">New puzzle</button></div></dialog>
<dialog id="statsDialog"><h2>Your stats</h2><div class="stats" id="statsBody"></div><div class="dialog-actions"><button data-close>Close</button></div></dialog>
<dialog id="profilesDialog"><h2>Profiles</h2><p>Each profile has separate handwriting learning, games, preferences and stats.</p><input id="newProfileName" maxlength="24" placeholder="New profile name"><div class="dialog-actions"><button id="addProfile">Add profile</button><button id="resetLearning" class="danger">Reset handwriting learning</button><button data-close>Close</button></div></dialog>
<script>
(() => {
  'use strict';
  const VERSION='0.9', MULTI_STROKE_PAUSE=1600, LEVELS=['Easy','Medium','Hard','Expert'];
  const K={db:'sp-profiles-v09',oldGames:'sp-games-v081',oldPrefs:'sp-prefs-v081',oldStats:'sp-stats-v081',oldLearn:'sp-learn-v081'};
  const $=s=>document.querySelector(s), board=$('#board'), status=$('#status');
  let state, selected=-1, drawing=false, activeStroke=[], timerId, paused=false, autoPaused=false;
  const defaults=()=>({level:'Medium',check:'solution',notes:false,matching:true});
  let db=load(K.db,null),prefs,learned;
  function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}
  function saveLocal(k,v){localStorage.setItem(k,JSON.stringify(v))}
  function initProfiles(){if(!db){const id='profile-'+Date.now();db={active:id,profiles:{[id]:{name:'My profile',prefs:{...defaults(),...load(K.oldPrefs,{})},games:load(K.oldGames,{}),stats:load(K.oldStats,[]),learn:load(K.oldLearn,{})}}};saveLocal(K.db,db)}if(!db.profiles[db.active])db.active=Object.keys(db.profiles)[0];loadActiveProfile()}
  function profile(){return db.profiles[db.active]}
  function loadActiveProfile(){const p=profile();prefs={...defaults(),...(p.prefs||{})};learned=p.learn||{};p.games=p.games||{};p.stats=p.stats||[];templates.cache=null}
  function persistProfile(){const p=profile();p.prefs=prefs;p.learn=learned;saveLocal(K.db,db)}
  function emptyCells(){return Array.from({length:81},()=>({value:0,ink:[],notes:{},pending:null,error:false}))}
  function shuffled(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function pattern(r,c){return (r*3+Math.floor(r/3)+c)%9}
  function fullGrid(){const rows=shuffled([0,1,2]).flatMap(b=>shuffled([0,1,2]).map(r=>b*3+r));const cols=shuffled([0,1,2]).flatMap(b=>shuffled([0,1,2]).map(c=>b*3+c));const nums=shuffled([1,2,3,4,5,6,7,8,9]);return rows.flatMap(r=>cols.map(c=>nums[pattern(r,c)]))}
  function candidates(grid,i){if(grid[i])return[];const used=new Set();const r=Math.floor(i/9),c=i%9;for(let n=0;n<9;n++){used.add(grid[r*9+n]);used.add(grid[n*9+c])}const br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;for(let y=br;y<br+3;y++)for(let x=bc;x<bc+3;x++)used.add(grid[y*9+x]);return [1,2,3,4,5,6,7,8,9].filter(n=>!used.has(n))}
  function countSolutions(grid,limit=2){let best=-1,opts=null;for(let i=0;i<81;i++)if(!grid[i]){const c=candidates(grid,i);if(!c.length)return 0;if(!opts||c.length<opts.length){best=i;opts=c;if(c.length===1)break}}if(best<0)return 1;let total=0;for(const n of opts){grid[best]=n;total+=countSolutions(grid,limit-total);grid[best]=0;if(total>=limit)break}return total}
  function logicScore(puzzle){const g=[...puzzle];let score=0,progress=true;while(progress){progress=false;for(let i=0;i<81;i++)if(!g[i]){const c=candidates(g,i);if(c.length===1){g[i]=c[0];score+=1;progress=true}}if(progress)continue;for(let unit=0;unit<27&&!progress;unit++){const inds=[];if(unit<9)for(let c=0;c<9;c++)inds.push(unit*9+c);else if(unit<18)for(let r=0;r<9;r++)inds.push(r*9+unit-9);else{const b=unit-18,br=Math.floor(b/3)*3,bc=(b%3)*3;for(let y=0;y<3;y++)for(let x=0;x<3;x++)inds.push((br+y)*9+bc+x)}for(let n=1;n<=9;n++){const spots=inds.filter(i=>!g[i]&&candidates(g,i).includes(n));if(spots.length===1){g[spots[0]]=n;score+=3;progress=true;break}}}}score+=g.filter(x=>!x).length*12;return score}
  function makePuzzle(level){const target={Easy:42,Medium:34,Hard:29,Expert:25}[level];let solution=fullGrid(),puzzle=[...solution];for(const i of shuffled([...Array(81).keys()])){if(puzzle.filter(Boolean).length<=target)break;const old=puzzle[i];puzzle[i]=0;if(countSolutions([...puzzle])!==1)puzzle[i]=old}return {solution,puzzle,score:logicScore(puzzle)}}
  function newGame(level=prefs.level){const p=makePuzzle(level);paused=false;state={v:VERSION,level,puzzle:p.puzzle,solution:p.solution,score:p.score,cells:emptyCells(),elapsed:0,started:Date.now(),complete:false,userPaused:false};prefs.level=level;savePrefs();saveGame();selected=-1;renderAll();startTimer();announce(`${level} puzzle ready`)}
  function games(){return profile().games}function saveGame(){if(!state)return;commitClock();games()[state.level]=state;persistProfile()}
  function resume(level=prefs.level){const s=games()[level];if(!s){announce(`No saved ${level} puzzle`);return}state=s;paused=!!state.userPaused;state.started=Date.now();selected=-1;renderAll();startTimer();announce(paused?'Saved puzzle is paused':'Saved puzzle resumed')}
  function currentElapsed(){return state?state.elapsed+(!paused&&!state.complete?Math.floor((Date.now()-state.started)/1000):0):0}
  function commitClock(){if(!state)return;if(!paused&&!state.complete)state.elapsed=currentElapsed();state.started=Date.now()}
  function startTimer(){clearInterval(timerId);timerId=setInterval(()=>{if(state&&!state.complete&&!paused)$('#timer').textContent=formatTime(currentElapsed())},1000)}
  function setPaused(value,user=false){if(!state||state.complete)return;if(value){commitClock();paused=true;if(user){state.userPaused=true;autoPaused=false}}else{paused=false;state.userPaused=false;state.started=Date.now()}$('#pauseCover').classList.toggle('show',paused);$('#pause').textContent=paused?'Resume':'Pause';saveGame();$('#timer').textContent=formatTime(currentElapsed());announce(paused?'Game paused':'Game resumed')}
  function formatTime(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
  function savePrefs(){persistProfile()}function announce(t){status.textContent=t}
  function buildUI(){for(const l of LEVELS){const b=document.createElement('button');b.textContent=l;b.onclick=()=>{if(l!==state?.level)newGame(l)};$('#difficulty').append(b)}for(let i=0;i<81;i++){const c=document.createElement('div');c.className='cell';c.dataset.i=i;const cv=document.createElement('canvas');cv.width=cv.height=180;c.append(cv);bindCanvas(cv,i);board.append(c)}for(let n=1;n<=9;n++){const b=document.createElement('button');b.textContent=n;b.onclick=()=>correctDigit(n);$('#digits').append(b)}const clear=document.createElement('button');clear.textContent='Clear';clear.onclick=eraseCell;$('#digits').append(clear);document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());renderProfileOptions()}
  function renderProfileOptions(){const s=$('#profileSelect');s.innerHTML='';for(const [id,p] of Object.entries(db.profiles)){const o=document.createElement('option');o.value=id;o.textContent=p.name;o.selected=id===db.active;s.append(o)}}
  function switchProfile(id){if(id===db.active)return;saveGame();db.active=id;loadActiveProfile();persistProfile();const existing=games()[prefs.level];existing?resume(prefs.level):newGame(prefs.level);renderProfileOptions();announce(`Now playing as ${profile().name}`)}
  function bindCanvas(cv,i){cv.addEventListener('pointerdown',e=>{if(paused||state.puzzle[i])return;select(i);drawing=true;activeStroke=[];cv.setPointerCapture(e.pointerId);point(e,cv,activeStroke);e.preventDefault()});cv.addEventListener('pointermove',e=>{if(!drawing)return;point(e,cv,activeStroke);preview(i);e.preventDefault()});cv.addEventListener('pointerup',e=>{if(!drawing)return;drawing=false;point(e,cv,activeStroke);finishStroke(i);e.preventDefault()});cv.addEventListener('click',()=>select(i))}
  function point(e,cv,s){const r=cv.getBoundingClientRect();s.push([(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height])}
  function select(i){if(paused)return;selected=i;renderHighlights();drawCell(i)}
  function digitAt(i){return state.puzzle[i]||state.cells[i].value||state.cells[i].pending?.digit||0}
  function renderHighlights(){const target=selected>=0?digitAt(selected):0;document.querySelectorAll('.cell').forEach((el,i)=>{el.classList.remove('selected','peer','match');if(selected<0)return;const sr=Math.floor(selected/9),sc=selected%9,r=Math.floor(i/9),c=i%9,sb=Math.floor(sr/3)*3+Math.floor(sc/3),b=Math.floor(r/3)*3+Math.floor(c/3);if(i===selected)el.classList.add('selected');else if(r===sr||c===sc||b===sb)el.classList.add('peer');if(prefs.matching&&target&&digitAt(i)===target)el.classList.add('match')})}
  function preview(i){drawCell(i,activeStroke)}
  function finishStroke(i){if(activeStroke.length<2)return;const cell=state.cells[i];if(cell.error){cell.pending.strokes.push(activeStroke)}else{cell.pending=cell.pending||{strokes:[],digit:0};cell.pending.strokes.push(activeStroke)}drawCell(i);clearTimeout(cell._recognize);announce('Stroke captured — keep writing, or pause to recognize');cell._recognize=setTimeout(()=>recognizeAndApply(i),MULTI_STROKE_PAUSE)}
  function darkness(ctx){const d=ctx.getImageData(0,0,28,28).data,out=[];for(let i=0;i<d.length;i+=4)out.push(1-(d[i]+d[i+1]+d[i+2])/765);return out}
  function bitmap(strokes){const cv=document.createElement('canvas');cv.width=cv.height=28;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,28,28);if(!strokes.length)return new Array(784).fill(0);let pts=strokes.flat(),xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys),scale=20/Math.max(maxx-minx,maxy-miny,.05),ox=14-(minx+maxx)*scale/2,oy=14-(miny+maxy)*scale/2;x.strokeStyle='#000';x.lineWidth=3;x.lineCap=x.lineJoin='round';for(const s of strokes){x.beginPath();s.forEach((p,j)=>(j?x.lineTo(p[0]*scale+ox,p[1]*scale+oy):x.moveTo(p[0]*scale+ox,p[1]*scale+oy)));x.stroke()}return darkness(x)}
  function templates(){if(templates.cache)return templates.cache;const out={};for(let n=1;n<=9;n++){out[n]={base:[],learn:learned[n]||[]};for(const font of ['bold 23px Arial','24px Georgia','bold 24px Comic Sans MS']){const c=document.createElement('canvas');c.width=c.height=28;const x=c.getContext('2d');x.fillStyle='white';x.fillRect(0,0,28,28);x.fillStyle='black';x.font=font;x.textAlign='center';x.textBaseline='middle';x.fillText(n,14,15);out[n].base.push(darkness(x))}}return templates.cache=out}
  function dist(a,b){let d=0,inter=0,union=0;for(let i=0;i<a.length;i++){d+=Math.abs(a[i]-b[i]);inter+=Math.min(a[i],b[i]);union+=Math.max(a[i],b[i])}return d/784+(1-inter/(union||1))}
  function recognize(strokes){const b=bitmap(strokes),t=templates();let best=1,score=Infinity;for(let n=1;n<=9;n++){const base=Math.min(...t[n].base.map(q=>dist(b,q)));const ls=t[n].learn.map(q=>dist(b,q)).sort((a,z)=>a-z);const learnedScore=ls.length>=2?(ls[0]+ls[1])/2:Infinity;const d=Math.min(base,learnedScore*.94);if(d<score){score=d;best=n}}return {digit:best,b}}
  function learnSample(d,b){const coverage=b.reduce((a,x)=>a+x,0)/b.length;if(coverage<.015||coverage>.48)return;const samples=learned[d]||[];if(samples.some(q=>dist(b,q)<.075))return;samples.push(b);learned[d]=samples.slice(-6);persistProfile();templates.cache=null}
  function recognizeAndApply(i){const cell=state.cells[i];if(!cell.pending)return;const r=recognize(cell.pending.strokes);cell.pending.digit=r.digit;applyDigit(i,r.digit,cell.pending.strokes,r.b,false)}
  function placedAt(j){return state.puzzle[j]||state.cells[j].value}
  function isConflict(i,d){const r=Math.floor(i/9),c=i%9;for(let n=0;n<9;n++){if(n!==c&&placedAt(r*9+n)===d)return true;if(n!==r&&placedAt(n*9+c)===d)return true}const br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;for(let y=br;y<br+3;y++)for(let x=bc;x<bc+3;x++){const j=y*9+x;if(j!==i&&placedAt(j)===d)return true}return false}
  function applyDigit(i,d,strokes,bmp,corrected){const cell=state.cells[i];const wrong=prefs.check==='solution'?d!==state.solution[i]:prefs.check==='conflict'?isConflict(i,d):false;if(wrong){cell.value=0;cell.ink=[];cell.pending={digit:d,strokes};cell.error=true;announce(`That ${d} is not valid here — erase or correct it`)}else if(prefs.notes){cell.notes[d]=strokes;cell.pending=null;cell.error=false;announce(`Note ${d} added`)}else{cell.value=d;cell.ink=strokes;cell.pending=null;cell.error=false;clearRelatedNotes(i,d);announce(corrected?`Corrected to ${d}`:`Recognized ${d}`);checkComplete()}if(corrected&&bmp)learnSample(d,bmp);saveGame();drawAllCells();renderHighlights()}
  function clearRelatedNotes(i,d){const r=Math.floor(i/9),c=i%9,br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;for(let n=0;n<9;n++){delete state.cells[r*9+n].notes[d];delete state.cells[n*9+c].notes[d]}for(let y=br;y<br+3;y++)for(let x=bc;x<bc+3;x++)delete state.cells[y*9+x].notes[d]}
  function correctDigit(d){if(selected<0)return;const c=state.cells[selected],strokes=c.pending?.strokes||c.ink;if(!strokes?.length){announce('Write in a cell first');return}applyDigit(selected,d,strokes,bitmap(strokes),true);$('#correctDialog').close()}
  function eraseCell(){if(paused){announce('Resume the game first');return}if(selected<0||state.puzzle[selected])return;state.cells[selected]={value:0,ink:[],notes:{},pending:null,error:false};saveGame();drawCell(selected);renderHighlights();announce('Cell erased')}
  function drawStroke(ctx,s,box={x:0,y:0,w:180,h:180},width=7){ctx.strokeStyle='#25211c';ctx.lineWidth=width;ctx.lineCap=ctx.lineJoin='round';ctx.beginPath();s.forEach((p,j)=>(j?ctx.lineTo(box.x+p[0]*box.w,box.y+p[1]*box.h):ctx.moveTo(box.x+p[0]*box.w,box.y+p[1]*box.h)));ctx.stroke()}
  function drawCell(i,previewStroke=null){const cv=board.children[i].querySelector('canvas'),ctx=cv.getContext('2d'),cell=state.cells[i];ctx.clearRect(0,0,180,180);board.children[i].classList.toggle('error',!!cell.error);const old=board.children[i].querySelector('.given');if(old)old.remove();if(state.puzzle[i]){const g=document.createElement('div');g.className='given';g.textContent=state.puzzle[i];board.children[i].append(g);return}for(const [n,ss] of Object.entries(cell.notes)){const k=+n-1,box={x:(k%3)*60+9,y:Math.floor(k/3)*60+8,w:42,h:42};for(const s of ss)drawStroke(ctx,s,box,4)}const main=cell.error?cell.pending?.strokes:cell.ink;for(const s of main||[])drawStroke(ctx,s,{x:18,y:12,w:144,h:154},8);if(previewStroke)drawStroke(ctx,previewStroke,{x:18,y:12,w:144,h:154},8)}
  function drawAllCells(){for(let i=0;i<81;i++)drawCell(i)}
  function renderAll(){prefs.level=state.level;$('#levelLabel').textContent=`${state.level} · logic score ${state.score}`;$('#check').value=prefs.check;$('#matching').value=prefs.matching?'on':'off';$('#notes').classList.toggle('on',prefs.notes);$('#notes').textContent=`Notes: ${prefs.notes?'On':'Off'}`;$('#pause').textContent=paused?'Resume':'Pause';$('#pauseCover').classList.toggle('show',paused);[...$('#difficulty').children].forEach(b=>b.classList.toggle('active',b.textContent===state.level));$('#timer').textContent=formatTime(currentElapsed());drawAllCells();renderHighlights();renderProfileOptions()}
  function checkComplete(){for(let i=0;i<81;i++)if(!state.puzzle[i]&&state.cells[i].value!==state.solution[i])return;state.elapsed=currentElapsed();state.complete=true;clearInterval(timerId);profile().stats.push({level:state.level,time:state.elapsed,date:new Date().toISOString()});saveGame();$('#finishText').textContent=`You solved this ${state.level} puzzle in ${formatTime(state.elapsed)}.`;$('#finishDialog').showModal()}
  $('#notes').onclick=()=>{if(paused)return;prefs.notes=!prefs.notes;savePrefs();renderAll();announce(prefs.notes?'Notes mode on':'Final answers mode')};$('#pause').onclick=()=>setPaused(!paused,true);$('#pauseCover').onclick=()=>setPaused(false,true);$('#erase').onclick=eraseCell;$('#correct').onclick=()=>selected>=0&&!paused?$('#correctDialog').showModal():announce(paused?'Resume the game first':'Select a cell first');$('#newGame').onclick=()=>newGame(state.level);$('#resume').onclick=()=>resume(prefs.level);$('#check').onchange=e=>{prefs.check=e.target.value;savePrefs();announce('Mistake checking updated')};$('#matching').onchange=e=>{prefs.matching=e.target.value==='on';savePrefs();renderHighlights();announce(`Matching-digit highlight ${prefs.matching?'on':'off'}`)};$('#stats').onclick=()=>{const s=profile().stats,best={};for(const x of s)best[x.level]=Math.min(best[x.level]??Infinity,x.time);$('#statsBody').innerHTML=`Profile: <b>${profile().name}</b><br>Completed: <b>${s.length}</b><br>${LEVELS.map(l=>`${l}: ${best[l]<Infinity?formatTime(best[l]):'—'}`).join('<br>')}`;$('#statsDialog').showModal()};$('#finishNew').onclick=()=>{$('#finishDialog').close();newGame(state.level)};
  $('#profileSelect').onchange=e=>switchProfile(e.target.value);$('#manageProfiles').onclick=()=>$('#profilesDialog').showModal();$('#addProfile').onclick=()=>{const name=$('#newProfileName').value.trim();if(!name){announce('Enter a profile name');return}const id='profile-'+Date.now();saveGame();db.profiles[id]={name,prefs:defaults(),games:{},stats:[],learn:{}};db.active=id;loadActiveProfile();persistProfile();$('#newProfileName').value='';$('#profilesDialog').close();renderProfileOptions();newGame('Medium');announce(`${name} profile created`)};$('#resetLearning').onclick=()=>{learned={};profile().learn={};persistProfile();templates.cache=null;$('#profilesDialog').close();announce(`Handwriting learning reset for ${profile().name}`)};
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused){autoPaused=true;setPaused(true,false)}else if(!document.hidden&&autoPaused&&!state.userPaused){autoPaused=false;setPaused(false,false)}});window.addEventListener('beforeunload',saveGame);
  initProfiles();buildUI();const existing=games()[prefs.level];existing?resume(prefs.level):newGame(prefs.level);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
})();
