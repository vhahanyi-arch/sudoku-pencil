<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f7f5ef"><link rel="manifest" href="manifest.json"><title>Sudoku Pencil</title>
<style>
:root{--p:#f7f5ef;--i:#242424;--l:#aaa69d;--h:#37352f;--panel:#efede6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:var(--p);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial}
button{font:inherit;border:0;background:transparent;color:inherit}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);max-width:1500px;margin:auto}
.top{height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}.title{font-family:"Bradley Hand","Marker Felt",cursive;font-size:32px}.center{display:flex;gap:18px;color:#625f57}.actions{display:flex;gap:6px}.action{padding:10px 12px;border-radius:12px}.action:active,.panel button:hover{background:#e4e1d8}
.content{min-height:0;display:grid;grid-template-columns:210px minmax(300px,760px) 210px;gap:24px;align-items:center;justify-content:center}.panel{background:#efede6bf;border:1px solid #dedbd1;border-radius:16px;padding:18px;color:#555148}.panel h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 12px;color:#77736a}.panel button{display:block;width:100%;text-align:left;padding:10px 8px;border-radius:10px}.selected{background:#e0ddd4!important}.stats{border-top:1px solid #d8d5cc;margin-top:15px;padding-top:15px;font-size:13px;line-height:2}
.boardwrap{width:min(78vw,78vh,760px);aspect-ratio:1}canvas{width:100%;height:100%;display:block;background:#fffdf9;border:2px solid var(--h);touch-action:none;box-shadow:0 4px 18px #0000000d}.bottom{text-align:center;padding:8px 0 12px;color:#817d73;font-size:13px}
@media(max-width:900px){.content{grid-template-columns:1fr}.panel{display:none}.boardwrap{width:min(92vw,76vh)}.top{height:58px}.center{font-size:13px}.title{font-size:27px}}
</style></head>
<body><div class="app">
<header class="top"><div class="title">Sudoku</div><div class="center"><span>Medium</span><span id="timer">00:00</span><span>✦ Pencil</span></div><div class="actions"><button class="action" id="undo">Undo</button><button class="action" id="redo">Redo</button><button class="action" id="clear">Clear</button></div></header>
<main class="content"><aside class="panel"><h3>Puzzle</h3><button id="new">＋ New puzzle</button><button class="selected">Medium</button><button>Hard</button><div class="stats">Puzzles solved&nbsp;&nbsp; 0<br>Best time&nbsp;&nbsp; —</div></aside>
<div class="boardwrap"><canvas id="board"></canvas></div>
<aside class="panel"><h3>Writing</h3><button id="erase">Eraser</button><button id="notes">Small notes</button><button id="pencil">Pencil</button><div class="stats">Write naturally in a square. Your ink stays as ink.</div></aside></main>
<div class="bottom">Write directly in the grid with Apple Pencil</div></div>
<script>
const puzzle=[[0,0,0,2,6,0,7,0,1],[6,8,0,0,7,0,0,9,0],[1,9,0,0,0,4,5,0,0],[8,2,0,1,0,0,0,4,0],[0,0,4,6,0,2,9,0,0],[0,5,0,0,0,3,0,2,8],[0,0,9,3,0,0,0,7,4],[0,4,0,0,5,0,0,3,6],[7,0,3,0,1,8,0,0,0]];
const canvas=document.getElementById("board"),ctx=canvas.getContext("2d");let size=0,dpr=1,cells=Array.from({length:81},()=>[]),undo=[],redo=[],stroke=null,cellIndex=-1,erase=false;
function snap(){return cells.map(a=>a.map(s=>s.map(p=>({...p}))));}function save(){undo.push(snap());if(undo.length>60)undo.shift();redo=[]}
function resize(){let r=canvas.parentElement.getBoundingClientRect();size=Math.floor(Math.min(r.width,r.height));dpr=devicePixelRatio||1;canvas.width=size*dpr;canvas.height=size*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}new ResizeObserver(resize).observe(canvas.parentElement);
function draw(){let c=size/9;ctx.clearRect(0,0,size,size);ctx.fillStyle="#fffdf9";ctx.fillRect(0,0,size,size);ctx.textAlign="center";ctx.textBaseline="middle";ctx.font=`600 ${Math.round(c*.31)}px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial`;for(let r=0;r<9;r++)for(let x=0;x<9;x++)if(puzzle[r][x]){ctx.fillStyle="#77736a";ctx.fillText(puzzle[r][x],x*c+c/2,r*c+c/2)}ctx.strokeStyle="#222";ctx.lineCap="round";ctx.lineJoin="round";for(let i=0;i<81;i++){let r=Math.floor(i/9),x=i%9;for(const s of cells[i]){if(s.length<2)continue;ctx.lineWidth=s.w||Math.max(2,c*.026);ctx.beginPath();ctx.moveTo(x*c+s[0].x,r*c+s[0].y);for(let k=1;k<s.length;k++)ctx.lineTo(x*c+s[k].x,r*c+s[k].y);ctx.stroke()}}for(let i=1;i<9;i++){ctx.strokeStyle=i%3?"#b5b1a8":"#37352f";ctx.lineWidth=i%3?1:2;ctx.beginPath();ctx.moveTo(i*c,0);ctx.lineTo(i*c,size);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*c);ctx.lineTo(size,i*c);ctx.stroke()}ctx.strokeStyle="#37352f";ctx.lineWidth=2;ctx.strokeRect(1,1,size-2,size-2)}
function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function idx(p){let c=Math.floor(p.x/(size/9)),r=Math.floor(p.y/(size/9));return r>=0&&r<9&&c>=0&&c<9?r*9+c:-1}
canvas.addEventListener("pointerdown",e=>{let p=pos(e),i=idx(p);if(i<0||puzzle[Math.floor(i/9)][i%9])return;save();cellIndex=i;if(erase){cells[i]=[];draw();return}let c=size/9,x=i%9,r=Math.floor(i/9);stroke=[{x:p.x-x*c,y:p.y-r*c}];stroke.w=Math.max(2,c*.026);cells[i].push(stroke);canvas.setPointerCapture(e.pointerId);draw()});
canvas.addEventListener("pointermove",e=>{if(!stroke)return;let p=pos(e),c=size/9,x=cellIndex%9,r=Math.floor(cellIndex/9);stroke.push({x:p.x-x*c,y:p.y-r*c});draw()});function end(){stroke=null;cellIndex=-1}canvas.addEventListener("pointerup",end);canvas.addEventListener("pointercancel",end);
document.getElementById("clear").onclick=()=>{save();cells=Array.from({length:81},()=>[]);draw()};document.getElementById("undo").onclick=()=>{if(undo.length){redo.push(snap());cells=undo.pop();draw()}};document.getElementById("redo").onclick=()=>{if(redo.length){undo.push(snap());cells=redo.pop();draw()}};document.getElementById("erase").onclick=()=>{erase=!erase;document.getElementById("erase").classList.toggle("selected",erase)};document.getElementById("pencil").onclick=()=>{erase=false;document.getElementById("erase").classList.remove("selected")};document.getElementById("notes").onclick=()=>alert("Small handwritten candidate marks are planned for v0.3.");document.getElementById("new").onclick=()=>{save();cells=Array.from({length:81},()=>[]);draw()};
let seconds=0;setInterval(()=>{seconds++;document.getElementById("timer").textContent=`${String(Math.floor(seconds/60)).padStart(2,"0")}:${String(seconds%60).padStart(2,"0")}`},1000);if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});resize();
</script></body></html>
